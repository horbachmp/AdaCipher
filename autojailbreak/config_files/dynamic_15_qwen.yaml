GeneralFields:
    #experiment
    num_runs: 3
    exp_type: dynamic
    exp_name: adaptive_no_guards
    log_path: logs_final
    log_postfix: ""
    seed: 0
    num_trials: 20


    use_denoiser: True
    use_summariser: True
    devices: [0,1,2]

    #max_new_tokens for each model
    strategy_model_max_new_tokens: 1024
    code_model_max_new_tokens: 2048
    target_max_new_tokens: 1024
    process_judge_max_new_tokens: 3072
    final_judge_max_new_tokens: 512
    benign_judge_max_new_tokens: 512

    #cipher
    start_cipher_name: qwerty
    start_cipher_description_path: "prompts/ciphers/fixed_bijection_descr.json"
    start_cipher_module_path: "ciphers/qwerty.py"
    
    
    base_cipher_prompt: "prompts/ciphers/cipher_base.txt"
    verification_tests_path: "prompts/ciphers/verification_tests.txt"

    
# misinformation_disinformation
# harmful
# cybercrime_intrusion
# harassment_bullying
# chemical_biological
# illegal

    #dataset
    dataset: "harmbench_split"
    query_max_length: 512
    train_dataset_size: 50 # 50
    val_dataset_size: 50 # 50
    test_dataset_size: 100 # 100

    validation_flag: False



    #benign eval
    benign_eval: True
    benign_eval_dataset: "alpaca"
    benign_eval_dataset_size: 20
    benign_eval_query_max_length: 512
    benign_eval_dataset_path: None

    benign_judge_model_type: openrouter
    benign_judge_model_name: openai/gpt-5.4-mini
    benign_judge_system_prompt: "prompts/benign_judge/base.txt"
    benign_judge_few_shot_path: "prompts/benign_judge/few_shot.json"


    #strategist: strategy
    strategy_model_type: openrouter
    strategy_model_name: "google/gemini-3.5-flash" #openai/gpt-4.1 # openai/gpt-5.4-mini
    strategy_system_prompt: "prompts/strategist/base_more_harm2.txt"
    strategy_few_shot_path: "prompts/strategist/few_shot.json"
    #strategist: code
    code_model_type: openrouter # local
    code_model_name: openai/gpt-5.4-mini # qwen/qwen3.5-27b
    code_system_prompt: "prompts/attacker/base.txt"
    code_few_shot_path: "prompts/attacker/few_shot.json"
    max_cipher_generation_iters: 5

    #process judge
    process_judge_model_type: openrouter
    process_judge_model_name: "google/gemini-3.5-flash" #openai/gpt-5.4-mini
    process_judge_system_prompt: "prompts/process_judge/base_more_harm2.txt"
    process_judge_few_shot_path: "prompts/process_judge/few_shot.json"
    process_judge_type: None


    #final judge
    final_judge_model_type: openrouter
    final_judge_model_name: openai/gpt-5.4-mini
    final_judge_system_prompt: "prompts/final_judge/base.txt"
    final_judge_few_shot_path: "prompts/final_judge/few_shot.json"
    final_judge_type: harm_bench



    #target
    target_model_type: openrouter
    target_system_prompt: "prompts/target/base.txt"
    target_few_shot_path: "prompts/target/few_shot.json"
    target_benign_few_shot_path: "prompts/target/benign_few_shot.json"

    #guardrail
    guard_type: None #"local_llamaguard"  # or "None" to disable
    use_input_guard: False
    use_output_guard: False

Substitutions:
    target_model_name: ["qwen/qwen3.5-397b-a17b"]

